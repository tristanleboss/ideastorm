# Light-touch flood protection. The limits are generous enough that a workshop full of
# people brainstorming at once never notices them, but a script hammering the API does.
framework:
    cache:
        pools:
            # A pool of their own, so a test run (and an operator with a good reason) can
            # reset the counters without throwing away every other cached thing.
            cache.rate_limiter:
                adapter: cache.app

    rate_limiter:
        idea_submission:
            policy: 'sliding_window'
            limit: 30
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        comment_posting:
            policy: 'sliding_window'
            limit: 90
            interval: '15 minutes'
            cache_pool: cache.rate_limiter
