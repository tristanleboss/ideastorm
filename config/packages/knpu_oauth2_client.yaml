# Social login providers. Each one is inert until its id/secret env vars are filled in:
# App\Service\SocialLoginRegistry only advertises providers that are fully configured,
# and App\Controller\SecurityController refuses to start a flow for the others.
knpu_oauth2_client:
    clients:
        google:
            type: google
            client_id: '%env(OAUTH_GOOGLE_ID)%'
            client_secret: '%env(OAUTH_GOOGLE_SECRET)%'
            redirect_route: connect_check
            redirect_params: { service: google }

        github:
            type: github
            client_id: '%env(OAUTH_GITHUB_ID)%'
            client_secret: '%env(OAUTH_GITHUB_SECRET)%'
            redirect_route: connect_check
            redirect_params: { service: github }

        facebook:
            type: facebook
            client_id: '%env(OAUTH_FACEBOOK_ID)%'
            client_secret: '%env(OAUTH_FACEBOOK_SECRET)%'
            redirect_route: connect_check
            redirect_params: { service: facebook }
            graph_api_version: v19.0
